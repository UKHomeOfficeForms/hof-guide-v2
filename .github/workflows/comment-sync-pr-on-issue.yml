name: Comment sync PR back on issue

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  comment-linked-sync-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Comment linked sync issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const issueMatches = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi)];
            const issueNumbers = [...new Set(issueMatches.map(match => Number(match[1])).filter(Boolean))];

            if (!issueNumbers.length) {
              core.info('No closing issue references found in PR body.');
              return;
            }

            for (const issueNumber of issueNumbers) {
              const issue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });

              const issueBody = issue.data.body || '';
              if (!issueBody.includes('<!-- hof-guide-sync-issue -->')) {
                core.info(`Issue #${issueNumber} is not a HOF guide sync issue.`);
                continue;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100
              });

              const marker = `<!-- hof-guide-sync-pr-link:${pr.number} -->`;
              const alreadyCommented = comments.some(comment => (comment.body || '').includes(marker));

              if (alreadyCommented) {
                core.info(`Tracking comment already exists on issue #${issueNumber} for PR #${pr.number}.`);
                continue;
              }

              const commentBody = [
                marker,
                `A guide sync pull request has been opened for this task: #${pr.number}`,
                '',
                `- PR: ${pr.html_url}`,
                `- Title: ${pr.title}`,
                `- State: ${pr.state}`,
                '',
                'Review the pull request and continue human-in-the-loop validation there.'
              ].join('\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: commentBody
              });
            }
