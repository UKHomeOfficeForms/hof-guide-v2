name: Deploy HOF Guide to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: 24.15.0
  VITEPRESS_BASE: ${{ vars.VITEPRESS_BASE }}
  VITEPRESS_BASE_FORCE: ${{ vars.VITEPRESS_BASE_FORCE }}
  PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve VitePress base path
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          normalise_base() {
            node -e "const input=process.argv[1] || '/'; if (input === '/') { process.stdout.write('/'); process.exit(0); } const clean='/' + input.replace(/^\/+|\/+$/g, '') + '/'; process.stdout.write(clean);" "$1"
          }

          PAGES_URL=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            | node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write(data.html_url || '')" \
            || true)

          if [ -n "$PAGES_URL" ]; then
            DETECTED_BASE=$(node -e "const u=process.argv[1];const p=new URL(u).pathname.replace(/\\/+$/,'');process.stdout.write(p || '/')" "$PAGES_URL")
            DETECTED_BASE=$(normalise_base "$DETECTED_BASE")
          else
            DETECTED_BASE="/"
          fi

          BASE_TO_USE="$DETECTED_BASE"

          if [ -n "$VITEPRESS_BASE" ]; then
            REQUESTED_BASE=$(normalise_base "$VITEPRESS_BASE")
            if [ "$VITEPRESS_BASE_FORCE" = "true" ]; then
              BASE_TO_USE="$REQUESTED_BASE"
              echo "VITEPRESS_BASE_FORCE=true, using explicit base: $BASE_TO_USE"
            elif [ "$REQUESTED_BASE" != "$DETECTED_BASE" ]; then
              echo "::warning::Ignoring VITEPRESS_BASE=$REQUESTED_BASE because Pages URL indicates base $DETECTED_BASE. Set VITEPRESS_BASE_FORCE=true to override."
            fi
          fi

          if [ -n "$PAGES_URL" ]; then
            echo "Detected Pages URL: $PAGES_URL"
          else
            echo "::warning::Could not read Pages URL from API. Using base '$BASE_TO_USE'."
          fi

          echo "VITEPRESS_BASE=$BASE_TO_USE" >> "$GITHUB_ENV"
          echo "Using VITEPRESS_BASE=$BASE_TO_USE"

      - name: Write CNAME (optional)
        if: ${{ env.PAGES_CUSTOM_DOMAIN != '' }}
        run: |
          printf '%s\n' "$PAGES_CUSTOM_DOMAIN" > public/CNAME

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Set up Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build guide
        run: yarn build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
