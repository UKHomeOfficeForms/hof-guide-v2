name: Deploy HOF Guide to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: 24.15.0
  VITEPRESS_BASE: ${{ vars.VITEPRESS_BASE }}
  PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve VitePress base path
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TO_USE="$VITEPRESS_BASE"

          if [ -z "$VITEPRESS_BASE" ]; then
            PAGES_URL=$(curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              | node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write(data.html_url || '')" \
              || true)

            if [ -n "$PAGES_URL" ]; then
              BASE_PATH=$(node -e "const u=process.argv[1];const p=new URL(u).pathname.replace(/\\/+$/,'');process.stdout.write(p || '/')" "$PAGES_URL")
              BASE_TO_USE="${BASE_PATH}/"
            else
              BASE_TO_USE="/"
            fi
          fi

          echo "VITEPRESS_BASE=$BASE_TO_USE" >> "$GITHUB_ENV"
          echo "Using VITEPRESS_BASE=$BASE_TO_USE"

      - name: Write CNAME (optional)
        if: ${{ env.PAGES_CUSTOM_DOMAIN != '' }}
        run: |
          printf '%s\n' "$PAGES_CUSTOM_DOMAIN" > public/CNAME

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Set up Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build guide
        run: yarn build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
