name: HOF guide sync from framework changes

on:
  repository_dispatch:
    types:
      - hof-framework-changed
  workflow_dispatch:
    inputs:
      hof_owner:
        description: Framework repository owner
        required: true
        default: UKHomeOfficeForms
      hof_repo:
        description: Framework repository name
        required: true
        default: hof
      base_sha:
        description: Base commit SHA
        required: true
      head_sha:
        description: Head commit SHA
        required: true
      changelog_notes:
        description: Changelog notes or release summary
        required: false
        default: ''

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-sync-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guide repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Build framework diff context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOF_OWNER: ${{ github.event.client_payload.hof_owner || inputs.hof_owner || 'UKHomeOfficeForms' }}
          HOF_REPO: ${{ github.event.client_payload.hof_repo || inputs.hof_repo || 'hof' }}
          HOF_BASE_SHA: ${{ github.event.client_payload.before_sha || inputs.base_sha }}
          HOF_HEAD_SHA: ${{ github.event.client_payload.after_sha || inputs.head_sha }}
          HOF_CHANGELOG_NOTES: ${{ github.event.client_payload.changelog_notes || inputs.changelog_notes || '' }}
          HOF_SYNC_CONTEXT_JSON: .tmp/hof-sync/context.json
          HOF_SYNC_REPORT_MD: .tmp/hof-sync/report.md
        run: node .github/skills/hof-doc-sync/scripts/build-sync-context.mjs

      - name: Upload sync context artifact
        uses: actions/upload-artifact@v4
        with:
          name: hof-sync-context
          path: .tmp/hof-sync/

      - name: Create or update sync issue for Copilot
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = fs.readFileSync('.tmp/hof-sync/report.md', 'utf8');
            const syncContext = JSON.parse(fs.readFileSync('.tmp/hof-sync/context.json', 'utf8'));

            const shortHead = syncContext.compare.head.slice(0, 7);
            const needsGuideUpdate = Boolean(syncContext.guide_update_required);
            const title = needsGuideUpdate
              ? `Sync HOF Guide from framework changes (${shortHead})`
              : `No guide update required for framework changes (${shortHead})`;
            const suggestedTitle = syncContext.suggested_pr_title;
            const syncIssueMarker = '<!-- hof-guide-sync-issue -->';
            const syncHeadMarker = `<!-- hof-guide-sync-head:${syncContext.compare.head} -->`;
            const initialBody = [
              'This issue was created automatically from the framework sync workflow.',
              '',
              report,
              '',
              syncIssueMarker,
              syncHeadMarker
            ].join('\n');

            const syncIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            let issue = syncIssues.find(item =>
              !item.pull_request &&
              (item.body || '').includes(syncIssueMarker) &&
              (item.body || '').includes(syncHeadMarker)
            );

            if (!issue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: initialBody
              });
              issue = created.data;
              core.setOutput('issue_action', 'created');
            } else {
              core.setOutput('issue_action', 'updated');
            }

            const finalBody = [
              'This issue was created automatically from the framework sync workflow.',
              '',
              report,
              '',
              syncIssueMarker,
              syncHeadMarker,
              '',
              '## Required execution mode',
              '',
              needsGuideUpdate
                ? [
                    '- Assign this issue to Copilot.',
                    '- Select the `HOF Guide Sync Agent` custom agent (or tell Copilot to use `hof-doc-sync`).',
                    `- Use the suggested PR / commit title: \`${suggestedTitle}\`.`,
                    `- When opening the PR, include \`Closes #${issue.number}\` in the PR body.`,
                    '- Do not create a planning-only commit.',
                    '- Keep this issue as the source of truth for human-in-the-loop review.'
                  ].join('\n')
                : [
                    '- No guide update is required for this framework change.',
                    '- Do not assign Copilot.',
                    '- Do not open a PR.',
                    '- The workflow will close this issue automatically after triage.'
                  ].join('\n')
            ].join('\n');

            const issueUpdate = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              title,
              body: finalBody,
              state: needsGuideUpdate ? 'open' : 'closed'
            };

            if (!needsGuideUpdate) {
              issueUpdate.state_reason = 'not_planned';
            }

            await github.rest.issues.update(issueUpdate);

            if (!needsGuideUpdate && issue.state !== 'closed') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  'The framework diff did not map to any guide updates, so no PR was opened.',
                  '',
                  'If this looks unexpected, re-run the sync workflow manually with a narrower compare range and inspect the generated context artifact.'
                ].join('\n')
              });
            }

            core.setOutput('issue_number', String(issue.number));
            core.setOutput('issue_url', issue.html_url);
            core.setOutput('should_assign_copilot', needsGuideUpdate ? 'true' : 'false');
            core.setOutput('suggested_pr_title', suggestedTitle || '');

      - name: Assign issue to Copilot
        id: assign-copilot
        if: steps.create-issue.outputs.should_assign_copilot == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.HOF_GUIDE_COPILOT_ASSIGN_TOKEN }}
          script: |
            try {
              const response = await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.ISSUE_NUMBER),
                assignees: ['copilot-swe-agent[bot]'],
                agent_assignment: {
                  target_repo: `${context.repo.owner}/${context.repo.repo}`,
                  base_branch: process.env.GUIDE_BASE_BRANCH,
                  custom_instructions: [
                    'Use the HOF Guide Sync Agent or hof-doc-sync skill to update docs from the framework diff context.',
                    `Suggested PR / commit title: ${process.env.SUGGESTED_PR_TITLE}`,
                    'Only open a PR after making at least one real documentation change.',
                    'Use a single conventional commit for the actual doc update. Do not create an initial planning commit.',
                    `If no documentation changes are required after reviewing the diff, do not open a PR and report that back on issue #${process.env.ISSUE_NUMBER}.`
                  ].join(' ')
                }
              });

              const assignees = response.data?.assignees || [];
              const assigneeLogins = assignees.map(assignee => assignee.login);
              const hasCopilotAssignee = assigneeLogins.includes('copilot-swe-agent[bot]') || assigneeLogins.includes('copilot');

              if (!hasCopilotAssignee) {
                core.warning(
                  'Copilot assignment API call succeeded but Copilot assignee is not immediately visible in returned assignees. ' +
                  'Continuing because some org/repo configurations do not expose Copilot in assignee lists immediately.'
                );
                core.setOutput('assigned', 'requested');
                core.setOutput('assigned_details', `assignees_visible=${assigneeLogins.join(',') || 'none'}`);
              } else {
                core.setOutput('assigned', 'true');
                core.setOutput('assigned_details', `assignees_visible=${assigneeLogins.join(',')}`);
              }
            } catch (error) {
              const status = error?.status ? `HTTP ${error.status}` : 'no-status';
              const details = error?.response?.data ? JSON.stringify(error.response.data) : error.message;
              core.setFailed(
                [
                  'Failed to auto-assign sync issue to Copilot.',
                  'Check that Copilot coding agent is enabled for this repository and that HOF_GUIDE_COPILOT_ASSIGN_TOKEN has the required scopes/permissions.',
                  `Underlying error (${status}): ${details}`
                ].join(' ')
              );
            }
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
          GUIDE_BASE_BRANCH: ${{ vars.HOF_GUIDE_SYNC_BASE_BRANCH || 'main' }}
          SUGGESTED_PR_TITLE: ${{ steps.create-issue.outputs.suggested_pr_title }}

      - name: Add workflow summary
        env:
          ISSUE_URL: ${{ steps.create-issue.outputs.issue_url }}
          ISSUE_ACTION: ${{ steps.create-issue.outputs.issue_action }}
          COPILOT_ASSIGNED: ${{ steps.assign-copilot.outputs.assigned }}
          COPILOT_ASSIGNED_DETAILS: ${{ steps.assign-copilot.outputs.assigned_details }}
          SHOULD_ASSIGN_COPILOT: ${{ steps.create-issue.outputs.should_assign_copilot }}
          SUGGESTED_PR_TITLE: ${{ steps.create-issue.outputs.suggested_pr_title }}
        run: |
          {
            echo "## HOF guide sync task"
            echo
            echo "- Action: ${ISSUE_ACTION}"
            echo "- Issue: ${ISSUE_URL}"
            if [ "${SHOULD_ASSIGN_COPILOT}" = "true" ]; then
              echo "- Guide update required: yes"
            else
              echo "- Guide update required: no"
            fi
            if [ "${SHOULD_ASSIGN_COPILOT}" = "true" ]; then
              echo "- Suggested PR / commit title: ${SUGGESTED_PR_TITLE}"
            else
              echo "- Suggested PR / commit title: n/a"
            fi
            if [ "${SHOULD_ASSIGN_COPILOT}" = "true" ]; then
              echo "- Copilot assignment: ${COPILOT_ASSIGNED}"
              echo "- Copilot assignment details: ${COPILOT_ASSIGNED_DETAILS}"
            else
              echo "- Copilot assignment: skipped"
            fi
            echo "- Context artifact: hof-sync-context"
          } >> "$GITHUB_STEP_SUMMARY"
